[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillforge"
version = "0.1.0"
description = "A stateless AI skill library with standard JSON I/O — no database, just workers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SkillForge Contributors" }]
keywords = ["ai", "skills", "pipeline", "ollama", "stateless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
pdf = ["pdfplumber>=0.10"]
geo = ["geopandas>=0.14", "fiona>=1.9"]
create = ["anthropic>=0.20"]
all = ["skillforge[dev,pdf,geo,create]"]

[project.scripts]
skillforge = "cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
python_files = ["test_*.py", "test.py"]
asyncio_mode = "auto"
consider_namespace_packages = true

