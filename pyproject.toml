[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillforge"
version = "0.1.0"
description = "A stateless AI skill library with standard JSON I/O — no database, just workers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SkillForge Contributors" }]
keywords = ["ai", "skills", "pipeline", "ollama", "stateless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/ilhankilic/yaratai-skill"
Repository = "https://github.com/ilhankilic/yaratai-skill"
Issues = "https://github.com/ilhankilic/yaratai-skill/issues"
Documentation = "https://github.com/ilhankilic/yaratai-skill/blob/master/README.md"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
pdf = ["pdfplumber>=0.10"]
geo = ["geopandas>=0.14", "fiona>=1.9", "pyproj>=3.6", "simplekml>=1.3"]
create = ["anthropic>=0.20"]
ui = ["beautifulsoup4>=4.12", "lxml>=5.0", "cssutils>=2.9"]
media = ["Pillow>=10.0", "piexif>=1.1", "pydub>=0.25"]
excel = ["openpyxl>=3.1"]
validation = ["jsonschema>=4.20"]
embedding = ["numpy>=1.26"]
all = ["skillforge[dev,pdf,geo,create,ui,media,excel,validation,embedding]"]

[project.scripts]
skillforge = "cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
python_files = ["test_*.py", "test.py"]
asyncio_mode = "auto"
consider_namespace_packages = true

