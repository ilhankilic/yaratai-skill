<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge — Panel</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
            --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
            --radius: 10px; --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── Header ─── */
        header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem;
        }
        header h1 { font-size: 1.3rem; font-weight: 700; }
        header h1 span { color: var(--accent); }
        header .badge {
            background: var(--accent); color: var(--bg); padding: 2px 10px;
            border-radius: 20px; font-size: .75rem; font-weight: 600;
        }
        header .health { margin-left: auto; font-size: .85rem; color: var(--muted); }
        header .health .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        header .health .dot.ok { background: var(--green); }
        header .health .dot.err { background: var(--red); }

        /* ── Layout ─── */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
        .tab {
            padding: .5rem 1.2rem; border-radius: var(--radius); cursor: pointer;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--muted); font-size: .9rem; transition: .2s;
        }
        .tab.active, .tab:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .panel { display: none; }
        .panel.active { display: block; }

        /* ── Cards ─── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.2rem; transition: .2s;
        }
        .card:hover { border-color: var(--accent); }
        .card h3 { font-size: 1rem; color: var(--accent); margin-bottom: .3rem; }
        .card .version { font-size: .75rem; color: var(--muted); }
        .card .desc { font-size: .85rem; margin: .6rem 0; color: var(--text); }
        .card .actions { display: flex; gap: .5rem; margin-top: .8rem; }

        /* ── Buttons ─── */
        .btn {
            padding: .4rem 1rem; border-radius: 6px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); cursor: pointer;
            font-size: .8rem; transition: .2s;
        }
        .btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .btn.primary:hover { opacity: .85; }

        /* ── Forms ─── */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: .6rem .8rem; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-family: var(--font); font-size: .9rem;
        }
        .form-group textarea { min-height: 120px; resize: vertical; font-family: 'Consolas', monospace; }

        /* ── Output / Modal ─── */
        .output {
            background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1rem; margin-top: 1rem; font-family: 'Consolas', monospace;
            font-size: .85rem; white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .output.success { border-color: var(--green); }
        .output.error { border-color: var(--red); }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem; width: 90%; max-width: 700px;
            max-height: 80vh; overflow-y: auto;
        }
        .modal h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); }
        .modal .close { float: right; cursor: pointer; color: var(--muted); font-size: 1.2rem; }

        .toast {
            position: fixed; bottom: 2rem; right: 2rem; padding: .8rem 1.5rem;
            border-radius: var(--radius); font-size: .85rem; z-index: 200;
            animation: fadeIn .3s; display: none;
        }
        .toast.show { display: block; }
        .toast.ok { background: var(--green); color: var(--bg); }
        .toast.err { background: var(--red); color: #fff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* ── Misc ─── */
        .empty { text-align: center; padding: 3rem; color: var(--muted); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <h1>⚡ <span>SkillForge</span></h1>
    <div class="badge">v0.1.0</div>
    <div class="health">
        <span class="dot" id="healthDot"></span>
        <span id="healthText">Checking…</span>
    </div>
</header>

<div class="container">

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="skills">🧩 Skills</div>
        <div class="tab" data-tab="run">▶️ Run</div>
        <div class="tab" data-tab="sync">🔄 Sync & Import</div>
    </div>

    <!-- ═══ Skills Panel ═══ -->
    <div class="panel active" id="panel-skills">
        <div class="grid" id="skillsGrid">
            <div class="empty">Loading skills…</div>
        </div>
    </div>

    <!-- ═══ Run Panel ═══ -->
    <div class="panel" id="panel-run">
        <div class="card" style="max-width:600px">
            <h3>Execute a Skill</h3>
            <div class="form-group">
                <label>Skill</label>
                <select id="runSkillSelect"><option value="">Loading…</option></select>
            </div>
            <div class="form-group">
                <label>Input JSON</label>
                <textarea id="runInput">{"data": {}}</textarea>
            </div>
            <button class="btn primary" id="runBtn">▶ Run</button>
            <div class="output" id="runOutput" style="display:none"></div>
        </div>
    </div>

    <!-- ═══ Sync Panel ═══ -->
    <div class="panel" id="panel-sync">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <!-- Sync from repo -->
            <div class="card">
                <h3>🔄 Sync All Skills from Repo</h3>
                <p style="font-size:.85rem;color:var(--muted);margin:.5rem 0;">Pull all valid skills from a GitHub repository into community/.</p>
                <div class="form-group">
                    <label>Repository URL</label>
                    <input id="syncUrl" placeholder="https://github.com/user/skillforge-community">
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input id="syncBranch" value="main">
                </div>
                <button class="btn primary" id="syncBtn">🔄 Sync</button>
                <div class="output" id="syncOutput" style="display:none"></div>
            </div>

            <!-- Import single skill -->
            <div class="card">
                <h3>📥 Import Single Skill</h3>
                <p style="font-size:.85rem;color:var(--muted);margin:.5rem 0;">Import one skill by specifying its path in a repo.</p>
                <div class="form-group">
                    <label>Repository URL</label>
                    <input id="importUrl" placeholder="https://github.com/user/repo">
                </div>
                <div class="form-group">
                    <label>Skill Path</label>
                    <input id="importPath" placeholder="skills/data/my-tool">
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input id="importBranch" value="main">
                </div>
                <button class="btn primary" id="importBtn">📥 Import</button>
                <div class="output" id="importOutput" style="display:none"></div>
            </div>
        </div>
    </div>

</div>

<!-- Skill Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Skill Info</h2>
        <div id="modalBody"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = '';  // same origin

// ── Tabs ────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    });
});

// ── Toast ───────────────────────────────────────────────────
function toast(msg, ok = true) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Health ──────────────────────────────────────────────────
async function checkHealth() {
    try {
        const r = await fetch(API + '/health');
        const d = await r.json();
        document.getElementById('healthDot').className = 'dot ok';
        document.getElementById('healthText').textContent = `${d.skills_loaded} skills • v${d.version}`;
    } catch {
        document.getElementById('healthDot').className = 'dot err';
        document.getElementById('healthText').textContent = 'Offline';
    }
}

// ── Load Skills ─────────────────────────────────────────────
async function loadSkills() {
    try {
        const r = await fetch(API + '/api/skills');
        const skills = await r.json();
        const grid = document.getElementById('skillsGrid');
        const select = document.getElementById('runSkillSelect');

        if (skills.length === 0) {
            grid.innerHTML = '<div class="empty">No skills found.</div>';
            return;
        }

        grid.innerHTML = skills.map(s => `
            <div class="card">
                <h3>${s.skill_id}</h3>
                <span class="version">v${s.version || '?'}</span>
                <div class="desc">${s.title || 'No description'}</div>
                <div class="actions">
                    <button class="btn" onclick="showInfo('${s.skill_id}')">ℹ️ Info</button>
                    <button class="btn" onclick="quickRun('${s.skill_id}')">▶ Run</button>
                </div>
            </div>
        `).join('');

        select.innerHTML = skills.map(s =>
            `<option value="${s.skill_id}">${s.skill_id}</option>`
        ).join('');
    } catch (e) {
        document.getElementById('skillsGrid').innerHTML = '<div class="empty">Failed to load skills.</div>';
    }
}

// ── Skill Info Modal ────────────────────────────────────────
async function showInfo(skillId) {
    const r = await fetch(API + `/api/skills/${skillId}/info`);
    const d = await r.json();
    document.getElementById('modalTitle').textContent = d.skill_id;
    document.getElementById('modalBody').innerHTML = `
        <p><strong>Version:</strong> ${d.version}</p>
        <p><strong>Description:</strong> ${d.description || '—'}</p>
        <h4 style="margin-top:1rem;color:var(--muted)">Input Schema</h4>
        <pre class="output">${JSON.stringify(d.schema_input, null, 2)}</pre>
        <h4 style="margin-top:1rem;color:var(--muted)">Output Schema</h4>
        <pre class="output">${JSON.stringify(d.schema_output, null, 2)}</pre>
        ${d.skill_md ? `<h4 style="margin-top:1rem;color:var(--muted)">SKILL.md</h4><pre class="output">${d.skill_md}</pre>` : ''}
    `;
    document.getElementById('detailModal').classList.add('show');
}
function closeModal() { document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('detailModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
});

// ── Quick Run (from card) ───────────────────────────────────
function quickRun(skillId) {
    document.getElementById('runSkillSelect').value = skillId;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    document.querySelector('[data-tab="run"]').classList.add('active');
    document.getElementById('panel-run').classList.add('active');
}

// ── Run Skill ───────────────────────────────────────────────
document.getElementById('runBtn').addEventListener('click', async () => {
    const skillId = document.getElementById('runSkillSelect').value;
    const inputEl = document.getElementById('runInput');
    const outEl = document.getElementById('runOutput');
    if (!skillId) return;

    let body;
    try { body = JSON.parse(inputEl.value); } catch { toast('Invalid JSON input', false); return; }

    outEl.style.display = 'block';
    outEl.className = 'output';
    outEl.textContent = 'Running…';

    try {
        const r = await fetch(API + `/api/skills/${skillId}/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const d = await r.json();
        outEl.textContent = JSON.stringify(d, null, 2);
        outEl.classList.add(d.success ? 'success' : 'error');
        toast(d.success ? 'Skill executed successfully' : 'Skill returned an error', d.success);
    } catch (e) {
        outEl.textContent = 'Request failed: ' + e.message;
        outEl.classList.add('error');
        toast('Request failed', false);
    }
});

// ── Sync ────────────────────────────────────────────────────
document.getElementById('syncBtn').addEventListener('click', async () => {
    const url = document.getElementById('syncUrl').value;
    const branch = document.getElementById('syncBranch').value;
    const outEl = document.getElementById('syncOutput');
    if (!url) { toast('Enter a repository URL', false); return; }

    outEl.style.display = 'block';
    outEl.textContent = 'Syncing…';
    outEl.className = 'output';

    try {
        const r = await fetch(API + '/api/sync/github', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repo_url: url, branch }),
        });
        const d = await r.json();
        outEl.textContent = JSON.stringify(d, null, 2);
        outEl.classList.add(d.success ? 'success' : 'error');
        if (d.success) { toast('Sync complete!'); loadSkills(); checkHealth(); }
        else toast(d.message, false);
    } catch (e) {
        outEl.textContent = 'Error: ' + e.message;
        outEl.classList.add('error');
    }
});

// ── Import ──────────────────────────────────────────────────
document.getElementById('importBtn').addEventListener('click', async () => {
    const url = document.getElementById('importUrl').value;
    const path = document.getElementById('importPath').value;
    const branch = document.getElementById('importBranch').value;
    const outEl = document.getElementById('importOutput');
    if (!url || !path) { toast('Fill in URL and path', false); return; }

    outEl.style.display = 'block';
    outEl.textContent = 'Importing…';
    outEl.className = 'output';

    try {
        const r = await fetch(API + '/api/sync/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repo_url: url, skill_path: path, branch }),
        });
        const d = await r.json();
        outEl.textContent = JSON.stringify(d, null, 2);
        outEl.classList.add(d.success ? 'success' : 'error');
        if (d.success) { toast('Skill imported!'); loadSkills(); checkHealth(); }
        else toast(d.message, false);
    } catch (e) {
        outEl.textContent = 'Error: ' + e.message;
        outEl.classList.add('error');
    }
});

// ── Init ────────────────────────────────────────────────────
checkHealth();
loadSkills();
setInterval(checkHealth, 30000);
</script>

</body>
</html>
